<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Casa – Mila Treffer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button{font:inherit;color:inherit}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes cardIn{0%{transform:translateY(14px) rotate(1deg);opacity:0}100%{transform:none;opacity:1}}
</style>
</helmet>
<div style="{{pageStyle}}">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="iInk" x="-5%" y="-10%" width="110%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="2" seed="4" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="0.9" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
  </svg>
  <div style="{{bandStyle}}">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; color: rgba(242,237,226,0.75)">‹ Casa</span>
      <span style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #E2C98A">Mila</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 12px">
      <span style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(242,237,226,0.7)">Aufdeckung</span>
      <span style="font-family: 'Caveat', cursive; font-size: 36px; line-height: 1; color: #F2EDE2">Eure Woche</span>
    </div>
  </div>
  <div style="{{bandEdge}}"></div>

  <main style="flex: 1; overflow-y: auto; padding: 16px 22px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 4px; animation: pop .5s ease both">
      <span style="{{hand}} font-size: 44px; line-height: 1">5 Treffer!</span>
      <span style="{{small}}">plus ein Joker · 6 Mahlzeiten stehen</span>
    </div>

    <span style="{{caps}}">Treffer</span>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{hits}}" as="h" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(29,29,27,0.08)">
          <span style="{{h.badge}}">{{h.mark}}</span>
          <span style="{{hand}} font-size: 23px; flex: 1; line-height: 1.1">{{h.name}}</span>
          <span style="font-size: 11px; color: #8A857A">{{h.note}}</span>
        </div>
      </sc-for>
    </div>

    <span style="{{caps}} margin-top: 8px">So sieht eure Woche aus</span>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{week}}" as="w" hint-placeholder-count="6">
        <div style="display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(29,29,27,0.08)">
          <span style="flex: none; width: 54px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F5B52">{{w.d}}</span>
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="{{w.style}}">{{w.dish}}</span>
            <span style="font-size: 12px; color: #5F5B52">{{w.who}}</span>
          </span>
        </div>
      </sc-for>
    </div>

    <button type="button" style="align-self: center; margin-top: 8px; font-family: 'Newsreader', Georgia, serif; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #F2EDE2; background: #4E5A34; border: none; border-radius: 999px; padding: 12px 22px; cursor: pointer">Woche übernehmen</button>
    <span style="text-align: center; font-size: 12px; color: #8A857A">Danach entstehen Einkaufszettel und Prep-Plan automatisch.</span>
  </main>

  <nav style="flex: none; height: 80px; border-top: 1px solid rgba(29,29,27,0.13); display: flex; align-items: center; padding: 0 6px 14px; box-sizing: border-box">
    <span style="{{navA}}">Woche</span>
    <span style="{{navI}}">Karte</span>
    <span style="flex: 1; display: flex; justify-content: center"><span style="width: 52px; height: 52px; border-radius: 26px; background: #4E5A34; color: #F2EDE2; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span></span>
    <span style="{{navI}}">Einkauf</span>
    <span style="{{navI}}">Prep</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {}; }
  renderVals() {
    var self = this; var s = this.state;
    function svgUrl(w, h, inner) { var t = "<svg xmlns='http://www.w3.org/2000/svg' width='" + w + "' height='" + h + "'>" + inner + "</svg>"; return 'url("data:image/svg+xml,' + encodeURIComponent(t) + '")'; }
    function noise(id, f, o, seed, m, w, h) { return svgUrl(w, h, "<filter id='" + id + "' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='" + f + "' numOctaves='" + o + "' seed='" + seed + "' stitchTiles='stitch'/><feColorMatrix type='matrix' values='" + m + "'/></filter><rect width='100%' height='100%' filter='url(#" + id + ")'/>"); }
    var grain = noise('g', '0.9', 3, 3, '0 0 0 0 0.30  0 0 0 0 0.24  0 0 0 0 0.16  0 0 0 0.42 -0.20', 240, 240);
    var grainD = noise('d', '0.9', 3, 5, '0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0 0.85  0 0 0 0.35 -0.15', 240, 240);
    var linen = noise('l', '0.02 0.6', 2, 8, '0 0 0 0 0.9  0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0.14 -0.05', 300, 300);
    var hand = "font-family:'Caveat',cursive;color:#243150;filter:url(#iInk);";
    var V = {
      hand: hand,
      caps: 'font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#5F5B52;font-weight:600;',
      small: 'font-size:12px;color:#5F5B52;',
      pageStyle: "position:relative;width:390px;height:844px;box-sizing:border-box;background-color:#F5F1E8;background-image:" + grain + ",radial-gradient(circle at 1px 1px,rgba(29,29,27,0.15) 1px,transparent 1.4px);background-size:240px 240px,19px 19px;background-position:0 0,6px 8px;color:#243150;font-family:'Newsreader',Georgia,serif;font-weight:500;display:flex;flex-direction:column;overflow:hidden;",
      bandStyle: 'flex:none;padding:52px 22px 16px 26px;background-color:#4E5A34;background-image:' + grainD + ',' + linen + ';background-size:240px 240px,300px 300px;',
      bandEdge: 'flex:none;height:6px;background-color:#F5F1E8;background-image:radial-gradient(circle at 3px 0px,#4E5A34 2.2px,transparent 2.6px);background-size:8px 6px;background-repeat:repeat-x;',
      navA: "flex:1;text-align:center;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:12px 0;font-weight:600;color:#243150;box-shadow:inset 0 -2px 0 #B08A45;",
      navI: "flex:1;text-align:center;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:12px 0;color:#5F5B52;",
      chip: 'display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#3F3C36;border:1px solid rgba(29,29,27,0.15);border-radius:999px;padding:3px 10px;background:rgba(255,255,255,0.5);'
    };

    function badge(kind) { return 'flex:none;width:30px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:11px;' + (kind === 'joker' ? 'background:#B08A45;color:#F5F1E8;' : 'background:#4E5A34;color:#F2EDE2;'); }
    V.hits = [
      { name: 'Hähnchen-Curry mit Reis', note: 'Abend · doppelt', mark: '✓✓', badge: badge('hit') },
      { name: 'Spaghetti Bolognese', note: 'Abend · doppelt', mark: '✓✓', badge: badge('hit') },
      { name: 'Lachs vom Egg', note: 'Abend · Joker Max', mark: '★', badge: badge('joker') },
      { name: 'Couscous-Bowl', note: 'Mittag', mark: '✓✓', badge: badge('hit') },
      { name: 'Ofengemüse mit Feta', note: 'Reserve', mark: '✓✓', badge: badge('hit') }
    ];
    var h = hand + 'font-size:22px;line-height:1.1;';
    var r = hand + 'font-size:22px;line-height:1.1;color:#6E6A60;';
    V.week = [
      { d: 'Mo · A', dish: 'Hähnchen-Curry (doppelt)', who: 'du kochst · Box „Mo · Curry“', style: h },
      { d: 'Di · M', dish: 'Curry vom Vortag', who: 'Reste · aufwärmen', style: r },
      { d: 'Di · A', dish: 'Lachs vom Egg', who: 'Anna kocht · Kartoffeln aus der Box', style: h },
      { d: 'Mi · M', dish: 'Couscous-Bowl', who: 'fertig in der Box', style: h },
      { d: 'Mi · A', dish: 'Spaghetti Bolognese (doppelt)', who: 'offen · übernehmen', style: h },
      { d: 'Do · M', dish: 'Bolognese vom Vortag', who: 'Reste · aufwärmen', style: r }
    ];

    return V;
  }
}
</script>
</body>
</html>
