<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Casa – Anfrage beantworten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#1F2A44}
textarea::placeholder{color:#8A857A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #F4F1EA; background-image: radial-gradient(circle at 1px 1px, rgba(29,29,27,0.16) 1px, transparent 1.4px); background-size: 19px 19px; background-position: 6px 8px; color: #1D1D1B; font-family: 'Newsreader', Georgia, serif; display: flex; flex-direction: column; padding: 26px 26px 28px 40px; gap: 18px; overflow: hidden">

  <div style="position: absolute; left: 22px; top: 0; bottom: 0; border-left: 1.5px dashed rgba(29,29,27,0.2)"></div>

  <a href="Main.dc.html" style="align-self: flex-start; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A60; padding: 10px 0">← Heute</a>

  <div style="position: relative; background: #EFE4C8; padding: 22px 18px 16px; transform: rotate(-1.2deg); box-shadow: 0 4px 10px rgba(31,42,68,0.10); display: flex; flex-direction: column; gap: 6px">
    <span style="position: absolute; top: -9px; left: 50%; width: 70px; height: 18px; margin-left: -35px; background: rgba(176,138,69,0.32); transform: rotate(-2deg)"></span>
    <p style="margin: 0; font-family: 'Caveat', cursive; font-size: 28px; line-height: 1.15; color: #1D1D1B">Theresa kann Mittwoch nicht. Holst du Valerie um 14 Uhr und bleibst bei ihr?</p>
    <span style="font-family: 'Caveat', cursive; font-size: 20px; color: #6B5222; align-self: flex-end">– Anna, heute 8:40</span>
  </div>

  <div style="display: flex; gap: 10px">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
      <button type="button" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{isLater}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A60">Ich melde mich bis</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{dates}}" as="d" hint-placeholder-count="3">
          <button type="button" onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="notiz" style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A60">Notiz dazu</label>
    <textarea id="notiz" rows="3" value="{{note}}" onChange="{{onNote}}" placeholder="Schreib was dazu …" style="font-family: 'Caveat', cursive; font-size: 24px; line-height: 32px; color: #1F2A44; background-color: #FBF9F4; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, rgba(31,42,68,0.16) 31px, rgba(31,42,68,0.16) 32px); background-position: 0 6px; border: none; border-radius: 2px; padding: 6px 12px; resize: none; box-shadow: 0 1px 3px rgba(31,42,68,0.08)"></textarea>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{c.pick}}" style="font-family: 'Caveat', cursive; font-size: 19px; color: #1F2A44; background: transparent; border: 1px dashed rgba(31,42,68,0.35); border-radius: 999px; padding: 6px 12px; min-height: 40px; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1"></div>

  <sc-if value="{{hasAnswer}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; align-items: center; gap: 12px; justify-content: center">
      <span style="font-family: 'Caveat', cursive; font-size: 20px; color: #6E6A60">Anna bekommt:</span>
      <span style="{{stampStyle}}">{{stamp}}</span>
    </div>
  </sc-if>

  <a href="Main.dc.html" style="{{sendStyle}}">Antwort schicken</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { choice: null, date: null, note: '' };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var colors = { ja: '#2F5D3A', nein: '#1D1D1B', spaeter: '#6B5222' };
    var defs = [
      { id: 'ja', label: 'Ja, gern' },
      { id: 'nein', label: 'Lieber nicht' },
      { id: 'spaeter', label: 'Später' }
    ];
    var options = defs.map(function (d) {
      var on = s.choice === d.id;
      return {
        label: d.label,
        style: "flex:1;min-width:0;min-height:56px;padding:6px 4px;line-height:1.05;font-family:'Caveat',cursive;font-size:22px;cursor:pointer;border-radius:4px;" + (on ? 'background:#1F2A44;color:#F4F1EA;border:1.5px solid #1F2A44;transform:rotate(-1deg);' : 'background:#FBF9F4;color:#1F2A44;border:1.5px solid rgba(31,42,68,0.25);'),
        pick: function () { self.setState({ choice: d.id, date: null }); }
      };
    });
    var dates = ['Heute Abend', 'Morgen', 'Montagsrunde'].map(function (l) {
      var on = s.date === l;
      return {
        label: l,
        style: "font-family:'Caveat',cursive;font-size:20px;border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer;color:#1D1D1B;" + (on ? 'background:#EFE4C8;border:1.5px solid #6B5222;' : 'background:transparent;border:1.5px solid rgba(31,42,68,0.25);'),
        pick: function () { self.setState({ date: l }); }
      };
    });
    var chips = ['Klar, mach ich!', 'Ja, aber erst ab 15 Uhr', 'Fragen wir Oma?', 'Lass uns kurz reden'].map(function (l) {
      return {
        label: l,
        pick: function () {
          var n = self.state.note;
          self.setState({ note: n ? n + ' ' + l : l });
        }
      };
    });
    var stamp = '';
    if (s.choice === 'ja') stamp = 'Ja';
    if (s.choice === 'nein') stamp = 'Lieber nicht';
    if (s.choice === 'spaeter') stamp = s.date ? 'Antwort bis ' + s.date : 'Kommt noch';
    var c = colors[s.choice] || '#1D1D1B';
    var ready = !!s.choice;
    return {
      options: options,
      dates: dates,
      chips: chips,
      note: s.note,
      onNote: function (e) { self.setState({ note: e.target.value }); },
      isLater: s.choice === 'spaeter',
      hasAnswer: ready,
      stamp: stamp + (s.note ? ' + Notiz' : ''),
      stampStyle: 'font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:' + c + ';border:1.5px solid ' + c + ';border-radius:3px;padding:3px 8px;transform:rotate(-3deg);',
      sendStyle: 'display:flex;align-items:center;justify-content:center;height:54px;border-radius:999px;font-size:16px;font-weight:500;letter-spacing:0.04em;' + (ready ? 'background:#1F2A44;color:#F4F1EA;' : 'background:#E6E1D5;color:#6E6A60;')
    };
  }
}
</script>
</body>
</html>
