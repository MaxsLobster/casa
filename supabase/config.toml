# Casa · Supabase-Konfiguration
# Bewusst klein gehalten: `supabase config push` ändert nur, was hier steht.
project_id = "casa-start"

[auth]
site_url = "https://maxslobster.github.io/casa/"
additional_redirect_urls = ["https://maxslobster.github.io/casa/**", "http://localhost:5173/casa/**"]

# Login-Mails mit Code: Link öffnet auf dem iPhone Safari statt der App, darum zusätzlich der Code.
# Achtung: Vorlagen lassen sich im Free-Tarif nur mit eigenem SMTP-Versand ändern (siehe SETUP.md A5).
# Bis dahin bleiben die beiden Template-Blöcke auskommentiert.
#[auth.email.template.magic_link]
