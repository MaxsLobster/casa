<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mila – Kochmodus Thermomix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#F4F1EA}
@keyframes milaInA{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes milaInB{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes milaBackA{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes milaBackB{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes milaTileA{from{opacity:0;transform:translateY(14px) scale(0.96)}to{opacity:1;transform:none}}
@keyframes milaTileB{from{opacity:0;transform:translateY(14px) scale(0.96)}to{opacity:1;transform:none}}
@keyframes milaSpin{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes milaPulse{0%,100%{opacity:1}50%{opacity:0.55}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #1F2A44; color: #F4F1EA; font-family: 'Newsreader', Georgia, serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex: none; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Gericht.dc.html" aria-label="Kochmodus schließen" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: rgba(244,241,234,0.75)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
      <span style="font-family: 'Caveat', cursive; font-size: 26px; color: #F4F1EA">Bolognese-Basis</span>
      <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #D9B877; border: 1.3px solid #D9B877; border-radius: 999px; padding: 2px 8px">TM</span>
    </div>
    <div style="display: flex; gap: 5px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
        <span style="{{b.style}}"></span>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; padding: 24px 22px 0; overflow: hidden">
    <div style="{{anim}}">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; align-items: baseline; gap: 10px">
          <span style="font-family: 'Caveat', cursive; font-size: 56px; line-height: 0.8; color: #D9B877">{{num}}</span>
          <span style="font-family: 'Caveat', cursive; font-size: 30px; line-height: 1; color: #F4F1EA">{{title}}</span>
        </div>
        <p style="margin: 0; font-size: 23px; line-height: 1.32; color: #F4F1EA">{{text}}</p>

        <sc-if value="{{hasIngs}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(244,241,234,0.6)">In den Mixtopf · Waage auf null</span>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{ings}}" as="i" hint-placeholder-count="3">
                <span style="font-family: 'Caveat', cursive; font-size: 21px; color: #F4F1EA; background: rgba(244,241,234,0.08); border: 1px solid rgba(244,241,234,0.18); border-radius: 999px; padding: 2px 12px">{{i}}</span>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
    </div>

    <sc-if value="{{isTm}}" hint-placeholder-val="{{true}}">
      <div style="{{tilesAnim}}">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 22px">
          <button type="button" onClick="{{toggleTimer}}" aria-label="{{timerAria}}" style="{{timeTileStyle}}">
            <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,241,234,0.6)">Zeit</span>
            <span style="{{clockStyle}}">{{clock}}</span>
            <span style="position: absolute; left: 10px; right: 10px; bottom: 10px; height: 4px; border-radius: 2px; background: rgba(244,241,234,0.15); overflow: hidden">
              <span style="{{barFill}}"></span>
            </span>
          </button>
          <div style="display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-height: 104px; box-sizing: border-box; padding: 12px 10px 18px; border-radius: 16px; background: rgba(244,241,234,0.07); border: 1px solid rgba(244,241,234,0.14)">
            <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,241,234,0.6)">Temperatur</span>
            <span style="{{tempStyle}}">{{temp}}</span>
          </div>
          <div style="display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-height: 104px; box-sizing: border-box; padding: 12px 10px 18px; border-radius: 16px; background: rgba(244,241,234,0.07); border: 1px solid rgba(244,241,234,0.14)">
            <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(244,241,234,0.6)">Stufe</span>
            <span style="display: flex; align-items: center; gap: 6px">
              <span style="font-size: 32px; line-height: 1; color: #F4F1EA">{{speed}}</span>
              <sc-if value="{{rev}}" hint-placeholder-val="{{false}}">
                <span style="{{revStyle}}">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D9B877" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Linkslauf"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 3v4.5h4.5"></path></svg>
                </span>
              </sc-if>
            </span>
          </div>
        </div>
        <span style="display: block; margin-top: 10px; font-size: 12px; color: rgba(244,241,234,0.6)">{{hint}}</span>
      </div>
    </sc-if>
  </main>

  <footer style="flex: none; display: flex; gap: 12px; padding: 16px 20px 30px">
    <button type="button" onClick="{{prev}}" aria-label="Vorheriger Schritt" disabled="{{isFirst}}" style="{{prevStyle}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{true}}">
      <button type="button" onClick="{{next}}" style="flex: 1; min-height: 60px; border-radius: 30px; border: none; background: #F4F1EA; color: #1F2A44; font-family: 'Newsreader', Georgia, serif; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
        Weiter
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-if>
    <sc-if value="{{isLast}}" hint-placeholder-val="{{false}}">
      <a href="Gericht.dc.html" style="flex: 1; min-height: 60px; border-radius: 30px; background: #D9B877; color: #1D1D1B; font-size: 17px; display: flex; align-items: center; justify-content: center">Fertig · guten Appetit</a>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, dir: 'n', flip: false, left: null, running: false };
    this.steps = [
      { title: 'Zerkleinern', t: 'Gemüse grob vierteln und in den Mixtopf geben.', i: ['1 Karotte', '1 Stange Sellerie', '1 Zwiebel', '3 Zehen Knoblauch'], tm: true, sec: 5, clockLabel: '5 Sek', temp: '–', speed: '5', rev: false },
      { title: 'Andünsten', t: 'Olivenöl dazugeben, Messbecher einsetzen.', i: ['2 EL Olivenöl'], tm: true, sec: 300, temp: '120 °C', speed: '1', rev: false },
      { title: 'Anbraten', t: 'Hack und Tomatenmark dazu, mit den Gewürzen.', i: ['500 g Rinderhack', '200 g Schweinehack', '1 EL Tomatenmark'], tm: true, sec: 480, temp: '100 °C', speed: '1', rev: true },
      { title: 'Reduzieren', t: 'Rotwein angießen, Messbecher weglassen.', i: ['200 ml Rotwein'], tm: true, sec: 300, temp: 'Varoma', speed: '1', rev: true },
      { title: 'Simmern', t: 'Tomaten, Milch und Lorbeerblatt dazu. Jetzt hast du eine Stunde frei.', i: ['800 g Dosentomaten', '50 ml Milch', '1 Lorbeerblatt'], tm: true, sec: 3600, temp: '95 °C', speed: '1', rev: true },
      { title: 'Für Valerie', t: 'Einen Schöpfer mild abnehmen. Dann mit Salz und Pfeffer abschmecken.', i: [], tm: false },
      { title: 'Portionieren', t: 'Zwei Portionen für heute, zwei für Dienstag, der Rest wandert als Cubes in den Freezer.', i: [], tm: false }
    ];
  }
  componentWillUnmount() { this.stopTick(); }
  stopTick() { if (this.tick) { clearInterval(this.tick); this.tick = null; } }
  go(delta) {
    var n = this.state.step + delta;
    if (n < 0 || n >= this.steps.length) return;
    this.stopTick();
    this.setState({ step: n, dir: delta > 0 ? 'n' : 'p', flip: !this.state.flip, left: null, running: false });
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var st = this.steps[s.step];
    var total = st.sec || 0;
    var left = s.left === null ? total : s.left;
    var clock;
    if (s.left === null && st.clockLabel) clock = st.clockLabel;
    else if (total < 60) clock = left + ' Sek';
    else if (left >= 3600) clock = '60:00';
    else { var mm = Math.floor(left / 60), ss = left % 60; clock = mm + ':' + (ss < 10 ? '0' : '') + ss; }
    var letter = s.flip ? 'A' : 'B';
    var name = (s.dir === 'n' ? 'milaIn' : 'milaBack') + letter;
    var bars = this.steps.map(function (x, k) {
      return { style: 'flex:1;height:4px;border-radius:2px;transition:background 0.4s;background:' + (k <= s.step ? '#D9B877' : 'rgba(244,241,234,0.18)') + ';' };
    });
    var isFirst = s.step === 0;
    var isLast = s.step === this.steps.length - 1;
    var done = total > 0 && left === 0;
    var pct = total ? (100 * (1 - left / total)) : 0;
    var hint;
    if (done) hint = 'Fertig – weiter zum nächsten Schritt.';
    else if (s.running) hint = 'Läuft. Tippen auf die Zeit pausiert.';
    else hint = 'Am Thermomix einstellen – oder auf die Zeit tippen, dann läuft der Countdown hier mit.';
    return {
      anim: 'animation:' + name + ' 0.45s cubic-bezier(0.2,0.8,0.3,1);',
      tilesAnim: 'animation:milaTile' + letter + ' 0.5s 0.08s cubic-bezier(0.2,0.8,0.3,1) both;',
      bars: bars,
      num: s.step + 1,
      title: st.title,
      text: st.t,
      ings: st.i,
      hasIngs: st.i.length > 0,
      isTm: !!st.tm,
      clock: clock,
      clockStyle: 'font-size:' + (clock.length > 5 ? '26px' : '32px') + ';line-height:1;font-variant-numeric:tabular-nums;color:' + (done ? '#D9B877' : '#F4F1EA') + ';' + (s.running ? 'animation:milaPulse 2s ease-in-out infinite;' : ''),
      timeTileStyle: 'position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:6px;min-height:104px;box-sizing:border-box;padding:12px 10px 18px;border-radius:16px;cursor:pointer;font-family:Newsreader,Georgia,serif;text-align:left;' +
        (s.running ? 'background:rgba(217,184,119,0.16);border:1.5px solid #D9B877;' : 'background:rgba(244,241,234,0.07);border:1px solid rgba(244,241,234,0.14);'),
      barFill: 'display:block;height:100%;border-radius:2px;background:#D9B877;transition:width 1s linear;width:' + pct.toFixed(1) + '%;',
      timerAria: s.running ? 'Timer pausieren' : 'Timer starten',
      temp: st.temp || '',
      tempStyle: 'font-size:' + ((st.temp || '').length > 6 ? '24px' : '30px') + ';line-height:1;color:#F4F1EA;',
      speed: st.speed || '',
      rev: !!st.rev,
      revStyle: 'display:flex;' + (s.running ? 'animation:milaSpin 2.4s linear infinite;' : ''),
      hint: hint,
      toggleTimer: function () {
        if (s.running) { self.stopTick(); self.setState({ running: false }); return; }
        if (done) return;
        self.setState({ running: true, left: left });
        self.stopTick();
        self.tick = setInterval(function () {
          var l = (self.state.left === null ? total : self.state.left) - 1;
          if (l <= 0) { self.stopTick(); self.setState({ left: 0, running: false }); }
          else self.setState({ left: l });
        }, 1000);
      },
      isFirst: isFirst,
      isLast: isLast,
      notLast: !isLast,
      prevStyle: 'flex:none;width:60px;height:60px;border-radius:30px;border:1px solid rgba(244,241,234,0.3);background:transparent;color:#F4F1EA;display:flex;align-items:center;justify-content:center;cursor:pointer;' + (isFirst ? 'opacity:0.3;cursor:default;' : ''),
      prev: function () { self.go(-1); },
      next: function () { self.go(1); }
    };
  }
}
</script>
</body>
</html>
