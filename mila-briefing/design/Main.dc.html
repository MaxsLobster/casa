<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mila – Woche</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#1F2A44}
@keyframes milaDrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes milaPop{0%{transform:scale(0.96);opacity:0}100%{transform:none;opacity:1}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #F4F1EA; background-image: radial-gradient(circle at 1px 1px, rgba(29,29,27,0.16) 1px, transparent 1.4px); background-size: 19px 19px; background-position: 6px 8px; color: #1D1D1B; font-family: 'Newsreader', Georgia, serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="position: absolute; left: 22px; top: 0; bottom: 80px; border-left: 1.5px dashed rgba(29,29,27,0.2)"></div>

  <main style="flex: 1; overflow-y: auto; padding: 14px 16px 16px 38px; display: flex; flex-direction: column; gap: 6px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" style="display: flex; align-items: center; gap: 4px; min-height: 40px; border: none; background: transparent; padding: 0; font-family: 'Newsreader', Georgia, serif; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6A60; cursor: pointer">‹ Casa</button>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5222">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 10h2M20 10h2M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"></path></svg>
        Mila
      </span>
    </div>

    <header style="display: flex; align-items: center; gap: 4px">
      <button type="button" aria-label="Vorige Woche" style="width: 40px; height: 44px; border: none; background: transparent; font-family: 'Caveat', cursive; font-size: 32px; color: #1F2A44; cursor: pointer">‹</button>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center">
        <span style="font-family: 'Caveat', cursive; font-size: 34px; line-height: 1; color: #1F2A44">Was es geben könnte</span>
        <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6E6A60">KW 45 · 2. – 8. Nov.</span>
      </div>
      <button type="button" aria-label="Nächste Woche" style="width: 40px; height: 44px; border: none; background: transparent; font-family: 'Caveat', cursive; font-size: 32px; color: #1F2A44; cursor: pointer">›</button>
    </header>

    <div style="display: flex; flex-direction: column; border-top: 1px solid rgba(29,29,27,0.14); margin-top: 4px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="border-bottom: 1px solid rgba(29,29,27,0.12)">
          <button type="button" onClick="{{d.toggle}}" aria-expanded="{{d.open}}" style="width: 100%; display: flex; align-items: center; gap: 12px; background: transparent; border: none; padding: 10px 0; min-height: 62px; cursor: pointer; text-align: left; font-family: 'Newsreader', Georgia, serif; color: #1D1D1B">
            <span style="flex: none; width: 40px; display: flex; flex-direction: column">
              <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1F2A44">{{d.wd}}</span>
              <span style="font-size: 12px; color: #6E6A60">{{d.date}}</span>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
              <span style="{{d.modeStyle}}">{{d.mode}}</span>
              <sc-if value="{{d.dish}}" hint-placeholder-val="{{true}}">
                <span style="font-family: 'Caveat', cursive; font-size: 25px; line-height: 1.05; color: #1D1D1B">{{d.dish}}</span>
              </sc-if>
              <sc-if value="{{d.empty}}" hint-placeholder-val="{{false}}">
                <span style="align-self: flex-start; margin-top: 3px; font-family: 'Caveat', cursive; font-size: 20px; color: #6B5222; border: 1.2px dashed rgba(107,82,34,0.6); border-radius: 999px; padding: 1px 12px">noch offen · Vorschlag?</span>
              </sc-if>
            </span>
            <span style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
              <sc-if value="{{d.tm}}" hint-placeholder-val="{{false}}">
                <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #1F2A44; border: 1.3px solid #1F2A44; border-radius: 999px; padding: 1px 7px">TM</span>
              </sc-if>
              <span style="font-size: 12px; color: #6E6A60; white-space: nowrap">{{d.time}}</span>
            </span>
          </button>
          <sc-if value="{{d.open}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 0 14px 52px; animation: milaDrop 0.28s ease-out">
              <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A60">Tauschen gegen</span>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{d.alts}}" as="a" hint-placeholder-count="3">
                  <button type="button" onClick="{{a.pick}}" style="font-family: 'Caveat', cursive; font-size: 20px; color: #1F2A44; background: #FBF9F4; border: 1px solid rgba(31,42,68,0.25); border-radius: 999px; padding: 3px 13px; min-height: 36px; cursor: pointer">{{a.name}}</button>
                </sc-for>
              </div>
              <sc-if value="{{d.dish}}" hint-placeholder-val="{{true}}">
                <a href="Gericht.dc.html" style="align-self: flex-start; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #1F2A44; border-bottom: 1.5px solid #B08A45; padding: 6px 0 2px">Rezept ansehen ›</a>
              </sc-if>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>

  <div style="flex: none; padding: 10px 16px 12px 38px; background: linear-gradient(to bottom, rgba(244,241,234,0), #F4F1EA 30%)">
    <sc-if value="{{notAdded}}" hint-placeholder-val="{{true}}">
      <button type="button" onClick="{{add}}" style="width: 100%; min-height: 52px; border: none; border-radius: 26px; background: #1F2A44; color: #F4F1EA; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Newsreader', Georgia, serif; font-size: 16px; cursor: pointer; box-shadow: 0 4px 14px rgba(31,42,68,0.22)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l-1.5 11a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
        Zutaten auf die Liste
        <span style="font-size: 12px; background: rgba(244,241,234,0.18); border-radius: 999px; padding: 2px 8px">19</span>
      </button>
    </sc-if>
    <sc-if value="{{added}}" hint-placeholder-val="{{false}}">
      <a href="Liste.dc.html" style="width: 100%; min-height: 52px; box-sizing: border-box; border-radius: 26px; background: #FBF9F4; border: 1.5px solid #B08A45; color: #1F2A44; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; animation: milaPop 0.3s ease-out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        19 Zutaten auf der Liste · ansehen ›
      </a>
    </sc-if>
  </div>

  <nav style="flex: none; height: 80px; border-top: 1px solid rgba(29,29,27,0.12); background: #F4F1EA; display: flex; align-items: center; justify-content: space-around; padding: 0 10px 14px; box-sizing: border-box">
    <a href="Main.dc.html" style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: #1F2A44; padding: 12px 4px; border-bottom: 2px solid #B08A45">Woche</a>
    <a href="Liste.dc.html" style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6A60; padding: 12px 4px">Liste</a>
    <a href="Gerichte.dc.html" style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6A60; padding: 12px 4px">Gerichte</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      open: 'Mi',
      added: false,
      plan: {
        Mo: 'Bolognese-Basis',
        Di: 'Rigatoni Bolognese',
        Mi: 'Shakshuka',
        Do: 'Gefüllte Paprika',
        Fr: 'Teriyaki-Hähnchen-Bowl',
        Sa: 'Pulled Pork vom Egg',
        So: ''
      }
    };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var info = {
      'Bolognese-Basis': { time: '75 Min', tm: true },
      'Rigatoni Bolognese': { time: '15 Min' },
      'Shakshuka': { time: '25 Min' },
      'Gefüllte Paprika': { time: '40 Min' },
      'Teriyaki-Hähnchen-Bowl': { time: '25 Min' },
      'Pulled Pork vom Egg': { time: '10 Std' },
      'Linsen-Dal': { time: '30 Min' },
      'Rotes Thai Curry': { time: '40 Min' },
      'Pasta Aglio e Olio': { time: '15 Min' },
      'Thai-Erdnussnudeln': { time: '20 Min' },
      'Miso-Lachs': { time: '27 Min' },
      'Lasagne aus der Basis': { time: '45 Min' },
      'Dal aus dem Freezer': { time: '10 Min' },
      'Korean Beef Bowl': { time: '20 Min' },
      'Pad Thai': { time: '30 Min' },
      'Rotisserie-Hähnchen': { time: '90 Min' },
      'Pizza vom Egg': { time: '60 Min' },
      'Boeuf Bourguignon': { time: '3 Std' },
      'Overnight Oats': { time: '10 Min', tm: true }
    };
    var days = [
      { wd: 'Mo', date: '2.11.', mode: 'Kochtag', tone: 'navy', alts: ['Linsen-Dal', 'Rotes Thai Curry'] },
      { wd: 'Di', date: '3.11.', mode: 'Aus Prep', tone: 'gold', alts: ['Lasagne aus der Basis', 'Dal aus dem Freezer'] },
      { wd: 'Mi', date: '4.11.', mode: 'Frisch', tone: 'grey', alts: ['Pasta Aglio e Olio', 'Thai-Erdnussnudeln', 'Miso-Lachs'] },
      { wd: 'Do', date: '5.11.', mode: 'Aus Prep', tone: 'gold', alts: ['Lasagne aus der Basis', 'Dal aus dem Freezer'] },
      { wd: 'Fr', date: '6.11.', mode: 'Frisch', tone: 'grey', alts: ['Korean Beef Bowl', 'Pad Thai', 'Pasta Aglio e Olio'] },
      { wd: 'Sa', date: '7.11.', mode: 'Grill', tone: 'gold', alts: ['Rotisserie-Hähnchen', 'Pizza vom Egg'] },
      { wd: 'So', date: '8.11.', mode: 'Frei', tone: 'grey', alts: ['Boeuf Bourguignon', 'Pasta Aglio e Olio', 'Pizza vom Egg'] }
    ];
    var tones = {
      navy: 'color:#1F2A44;',
      gold: 'color:#6B5222;',
      grey: 'color:#6E6A60;'
    };
    var out = days.map(function (d) {
      var dish = s.plan[d.wd];
      var isOpen = s.open === d.wd;
      var meta = info[dish] || {};
      return {
        wd: d.wd,
        date: d.date,
        mode: d.mode,
        modeStyle: 'font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;' + tones[d.tone],
        dish: dish,
        empty: !dish,
        tm: !!meta.tm,
        time: meta.time || '',
        open: isOpen,
        toggle: function () { self.setState({ open: isOpen ? null : d.wd }); },
        alts: d.alts.filter(function (n) { return n !== dish; }).map(function (n) {
          return {
            name: n,
            pick: function () {
              var p = Object.assign({}, s.plan);
              p[d.wd] = n;
              self.setState({ plan: p, open: null });
            }
          };
        })
      };
    });
    return {
      days: out,
      added: s.added,
      notAdded: !s.added,
      add: function () { self.setState({ added: true }); }
    };
  }
}
</script>
</body>
</html>
