<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { chosen: null, open: false };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var content = {
      weisheit: { label: 'Weisheit des Tages', text: '„Während man es aufschiebt, eilt das Leben vorbei.“', source: 'Seneca' },

      heute: { label: 'Heute vor 88 Jahren', text: 'Orson Welles’ Hörspiel „Krieg der Welten“ versetzt Amerika in Aufregung.', source: '30.10.1938' }
    };
    var defs = [
      { id: 'weisheit', aria: 'Weisheit des Tages', isW: true },
      { id: 'wort', aria: 'Wort des Tages', isA: true },
      { id: 'heute', aria: 'Was geschah heute', isH: true }
    ];
    var cats = defs.map(function (d) {
      var isChosen = s.chosen === d.id;
      var locked = !!s.chosen && !isChosen;
      var look;
      if (isChosen && s.open) look = 'background:rgba(31,42,68,0.12);color:#1F2A44;';
      else if (isChosen) look = 'background:transparent;color:#1F2A44;box-shadow:inset 0 -2px 0 #B08A45;';
      else if (locked) look = 'background:transparent;color:#1F2A44;opacity:0.22;cursor:default;';
      else look = 'background:transparent;color:#6E6A60;';
      return {
        aria: d.aria + (locked ? ' (heute schon gewählt)' : ''),
        isW: !!d.isW, isA: !!d.isA, isH: !!d.isH,
        locked: locked,
        style: 'width:32px;height:36px;display:flex;align-items:center;justify-content:center;border:none;border-radius:8px;cursor:pointer;padding:0;font-family:Newsreader,Georgia,serif;' + look,
        pick: function () {
          if (locked) return;
          if (!s.chosen) self.setState({ chosen: d.id, open: true });
          else self.setState({ open: !s.open });
        }
      };
    });
    var c = s.chosen ? content[s.chosen] : null;
    return {
      cats: cats,
      showText: !!c && s.open,
      label: c ? c.label : '',
      text: c ? c.text : '',
      source: c ? c.source : ''
    };
  }
}
