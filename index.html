<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>Casa</title>
    <meta name="description" content="Casa – Notizbuch für zwei" />
    <meta name="theme-color" content="#F4F1EA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Casa" />
    <link rel="icon" href="/casa/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/casa/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
    <script>
      // Dunkelmodus schon vor dem ersten Render setzen (kein Aufblitzen).
      (function () {
        try {
          var auto = localStorage.getItem('casa.darkAuto');
          var h = new Date().getHours();
          if (auto !== 'off' && (h >= 20 || h < 6)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
