<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Casa – Woche mit Zeichen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#1F2A44}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #F4F1EA; background-image: radial-gradient(circle at 1px 1px, rgba(29,29,27,0.16) 1px, transparent 1.4px); background-size: 19px 19px; background-position: 6px 8px; color: #1D1D1B; font-family: 'Newsreader', Georgia, serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="position: absolute; left: 22px; top: 0; bottom: 80px; border-left: 1.5px dashed rgba(29,29,27,0.2)"></div>

  <main style="flex: 1; overflow-y: auto; padding: 26px 16px 24px 38px; display: flex; flex-direction: column; gap: 10px">

    <header style="display: flex; align-items: center; gap: 4px">
      <button type="button" aria-label="Vorige Woche" style="width: 40px; height: 44px; border: none; background: transparent; font-family: 'Caveat', cursive; font-size: 32px; color: #1F2A44; cursor: pointer">‹</button>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center">
        <span style="font-family: 'Caveat', cursive; font-size: 34px; line-height: 1; color: #1F2A44">26. Okt. – 1. Nov.</span>
        <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6E6A60">KW 44</span>
      </div>
      <button type="button" aria-label="Nächste Woche" style="width: 40px; height: 44px; border: none; background: transparent; font-family: 'Caveat', cursive; font-size: 32px; color: #1F2A44; cursor: pointer">›</button>
      <button type="button" aria-label="Normalwoche bearbeiten" style="width: 40px; height: 44px; border: none; background: transparent; color: #6E6A60; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 9.5h17M8 3v4M16 3v4"></path><path d="M14.5 15.5a2.6 2.6 0 1 1-.8-2.2"></path><path d="M14 11.8v1.8h-1.8"></path></svg>
      </button>
    </header>

    <div style="display: flex; align-items: flex-end; gap: 10px; padding: 4px 0 0; border-bottom: 1px solid rgba(29,29,27,0.14); padding-bottom: 6px">
      <span style="flex: none; width: 46px"></span>
      <div style="position: relative; flex: 1; height: 14px">
        <span style="position: absolute; left: 0; font-size: 10px; color: #8A857A">6</span>
        <span style="position: absolute; left: 25%; transform: translateX(-50%); font-size: 10px; color: #8A857A">10</span>
        <span style="position: absolute; left: 50%; transform: translateX(-50%); font-size: 10px; color: #8A857A">14</span>
        <span style="position: absolute; left: 75%; transform: translateX(-50%); font-size: 10px; color: #8A857A">18</span>
        <span style="position: absolute; right: 0; font-size: 10px; color: #8A857A">22</span>
      </div>
      <span style="flex: none; width: 60px"></span>
      <span style="flex: none; width: 12px"></span>
    </div>

    <div style="position: relative; display: flex; flex-direction: column">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="{{d.wrapStyle}}">
          <button type="button" onClick="{{d.toggle}}" aria-expanded="{{d.open}}" style="width: 100%; display: flex; align-items: center; gap: 10px; background: transparent; border: none; padding: 12px 0; min-height: 56px; cursor: pointer; text-align: left; font-family: 'Newsreader', Georgia, serif; color: #1D1D1B">
            <span style="flex: none; width: 46px; display: flex; flex-direction: column">
              <span style="{{d.wdStyle}}">{{d.wd}}</span>
              <span style="font-size: 12px; color: #6E6A60">{{d.date}}</span>
            </span>
            <span style="position: relative; flex: 1; height: 14px; border-radius: 7px; border: 1px solid rgba(31,42,68,0.28); background: #FBF9F4; overflow: hidden; box-sizing: border-box">
              <sc-for list="{{d.segs}}" as="s" hint-placeholder-count="2">
                <span style="{{s.style}}"></span>
              </sc-for>
              <sc-if value="{{d.isToday}}" hint-placeholder-val="{{false}}">
                <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 66.67%; background: rgba(31,42,68,0.14); border-right: 2px solid #6B5222; box-sizing: border-box"></span>
              </sc-if>
            </span>
            <span style="flex: none; width: 60px; display: flex; justify-content: flex-end; align-items: center; gap: 6px">
              <sc-if value="{{d.hasOpen}}" hint-placeholder-val="{{false}}">
                <span aria-label="Etwas offen" style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px dashed #6B5222; box-sizing: border-box"></span>
              </sc-if>
              <sc-if value="{{d.tasks}}" hint-placeholder-val="{{false}}">
                <span aria-label="Fällige Aufgaben" style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid #1F2A44; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #1F2A44">{{d.tasks}}</span>
              </sc-if>
            </span>
            <span style="flex: none; width: 12px"></span>
          </button>
          <sc-if value="{{d.open}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 22px 16px 56px">
              <sc-for list="{{d.lines}}" as="l" hint-placeholder-count="2">
                <div style="display: flex; flex-direction: column">
                  <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A60">{{l.label}}</span>
                  <span style="font-family: 'Caveat', cursive; font-size: 22px; line-height: 1.15; color: #1D1D1B">{{l.text}}</span>
                </div>
              </sc-for>
              <sc-if value="{{d.openChip}}" hint-placeholder-val="{{false}}">
                <button type="button" style="align-self: flex-start; font-family: 'Caveat', cursive; font-size: 19px; color: #6B5222; background: transparent; border: 1.2px dashed rgba(107,82,34,0.6); border-radius: 999px; padding: 4px 12px; min-height: 36px; cursor: pointer">{{d.openChip}}</button>
              </sc-if>
              <sc-if value="{{d.taskList}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A60">Für dich fällig</span>
                  <sc-for list="{{d.taskList}}" as="t" hint-placeholder-count="2">
                    <span style="display: flex; align-items: center; gap: 10px">
                      <span style="flex: none; width: 16px; height: 16px; border-radius: 8px; border: 1.5px solid #1F2A44; box-sizing: border-box"></span>
                      <span style="font-family: 'Caveat', cursive; font-size: 21px; line-height: 1.15; color: #1F2A44">{{t}}</span>
                    </span>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </sc-if>
        </div>
      </sc-for>

      <div style="position: absolute; right: 0; bottom: 0; width: 12px; height: 46px; border-radius: 6px 6px 0 0; background: linear-gradient(to bottom, #B08A45 70%, rgba(176,138,69,0))" aria-label="Valerie bei Oma ab Sonntag"></div>
    </div>

    <p style="margin: 8px 0 0; font-style: italic; font-size: 13px; line-height: 1.5; color: #3F3C36">Gold: Valerie versorgt · Navy: Termin · Kreis mit Zahl: deine Aufgaben · gestrichelt: noch offen · Streifen rechts: mehrere Tage</p>
  </main>

  <nav style="flex: none; height: 80px; border-top: 1px solid rgba(29,29,27,0.12); background: #F4F1EA; display: flex; align-items: center; justify-content: space-around; padding: 0 10px 14px; box-sizing: border-box">
    <a href="StartB1.dc.html" style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6A60; padding: 12px 4px">Heute</a>
    <a href="Woche3.dc.html" style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: #1F2A44; padding: 12px 4px; border-bottom: 2px solid #B08A45">Woche</a>
    <a href="Neu.dc.html" aria-label="Neu eintragen" style="width: 52px; height: 52px; border-radius: 26px; background: #1F2A44; color: #F4F1EA; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="ToDos.dc.html" style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6A60; padding: 12px 4px">To-Dos</a>
    <a href="Montag.dc.html" style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6A60; padding: 12px 4px">Sonntag</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'Fr' };
  }
  renderVals() {
    var self = this;
    function pct(h) { return ((h - 6) / 16 * 100).toFixed(2); }
    function seg(from, to, kind) {
      var col = kind === 'v' ? 'background:#B08A45;opacity:0.55;' : 'background:#1F2A44;';
      return { style: 'position:absolute;top:2px;bottom:2px;border-radius:4px;left:' + pct(from) + '%;width:' + (pct(to) - pct(from)).toFixed(2) + '%;' + col };
    }
    var days = [
      { wd: 'Mo', date: '26.10.', past: true, segs: [seg(8, 18, 'v')],
        lines: [['Valerie', 'Du bringst, Oma holt um 14 Uhr'], ['Abend', 'Du kochst, Anna bringt ins Bett']] },
      { wd: 'Di', date: '27.10.', past: true, segs: [seg(8, 14, 'v')],
        lines: [['Valerie', 'Du bringst, Anna holt um 14 Uhr'], ['Abend', 'Anna kocht']] },
      { wd: 'Mi', date: '28.10.', past: true, segs: [seg(8, 14, 'v')], hasOpen: true, openChip: 'Essen offen · übernehmen',
        lines: [['Valerie', 'Theresa holt um 14 Uhr'], ['Abend', 'Anna bringt ins Bett']] },
      { wd: 'Do', date: '29.10.', past: true, segs: [seg(8, 13, 'v'), seg(15, 16, 't'), seg(18, 20.5, 't')],
        lines: [['Valerie', 'Anna holt um 13 Uhr'], ['Termine', '15–16 Turnen · ab 18 Essen bei Freunden']] },
      { wd: 'Fr', date: '30.10.', today: true, segs: [seg(8, 14, 'v')], tasks: 3, hasOpen: true, openChip: 'Abend offen · übernehmen',
        lines: [['Valerie', 'Du bringst, Anna holt um 14 Uhr'], ['Anna', 'Freier Tag']],
        taskList: ['Altglas/Plastik/Papier wegbringen', 'Lounge-Kissen in den Keller', 'Kamera Gang Zugangsdaten teilen'] },
      { wd: 'Sa', date: '31.10.', segs: [], hasOpen: true, openChip: 'Familientag? · festlegen',
        lines: [['Wochenende', 'Ein Familientag, ein Tag geteilt']] },
      { wd: 'So', date: '1.11.', segs: [seg(6, 22, 'v')], tasks: 2, hasOpen: true, openChip: 'Familientag? · festlegen',
        lines: [['Valerie', 'Bei Oma bis Di'], ['Abend', '20:00 Sonntagsrunde']],
        taskList: ['Haustürschlüssel suchen', 'Salz für Wasserenthärtung (Obi)'] }
    ];
    var out = days.map(function (d) {
      var isOpen = self.state.open === d.wd;
      return {
        wd: d.wd,
        date: d.date,
        segs: d.segs,
        isToday: !!d.today,
        hasOpen: !!d.hasOpen,
        tasks: d.tasks || '',
        open: isOpen,
        openChip: d.openChip || '',
        taskList: d.taskList || '',
        lines: d.lines.map(function (l) { return { label: l[0], text: l[1] }; }),
        wrapStyle: 'border-bottom:1px solid rgba(29,29,27,0.12);' + (d.past && !isOpen ? 'opacity:0.5;' : '') + (d.today ? 'background:rgba(176,138,69,0.08);margin:0 -8px;padding:0 8px;border-radius:6px;' : ''),
        wdStyle: "font-size:14px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;" + (d.today ? 'color:#6B5222;' : 'color:#1F2A44;'),
        toggle: function () { self.setState({ open: isOpen ? null : d.wd }); }
      };
    });
    return { days: out };
  }
}
</script>
</body>
</html>
