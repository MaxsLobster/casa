<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Casa – Anker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{color:inherit;text-decoration:none} button{font:inherit;color:inherit}</style>
</helmet>
<div style="{{pageStyle}}">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="kInk" x="-5%" y="-10%" width="110%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="2" seed="4" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="0.9" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
    <filter id="kRough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
  </svg>
  <div style="{{perfStyle}}"></div>

  <main style="flex: 1; overflow-y: auto; padding: 30px 22px 20px 40px; display: flex; flex-direction: column; gap: 10px">
    <header style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="{{caps}} font-weight: 400">Was uns wichtig ist</span>
        <span style="{{hand}} font-size: 42px; line-height: 1.05">Anker</span>
      </div>
      <span style="font-family: 'Caveat', cursive; font-size: 20px; color: #6B5222; border: 1.2px dashed rgba(107,82,34,0.6); border-radius: 999px; padding: 4px 12px">Sonntagsrunde</span>
    </header>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-bottom: 4px; border-bottom: 1px solid rgba(29,29,27,0.14)">
          <span style="{{caps}}">{{g.name}}</span><span style="font-family: 'Caveat', cursive; font-size: 20px; color: #6B5222">{{g.count}}</span>
        </div>
        <sc-for list="{{g.items}}" as="a" hint-placeholder-count="2">
          <a href="AnkerDetail.dc.html" style="display: flex; flex-direction: column; gap: 3px; padding: 10px 0; border-bottom: 1px solid rgba(29,29,27,0.08)">
            <span style="display: flex; align-items: center; gap: 8px">
              <span style="color: #B08A45">⚓︎</span>
              <span style="font-size: 16px; font-weight: 600; color: #243150; flex: 1">{{a.title}}</span>
              <sc-if value="{{a.pinned}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #8A857A">Startseite</span></sc-if>
            </span>
            <span style="display: flex; gap: 4px; align-items: center; padding-left: 22px">
              <sc-for list="{{a.phases}}" as="p" hint-placeholder-count="5"><span style="{{p}}"></span></sc-for>
              <span style="margin-left: 8px; font-size: 12px; color: #5F5B52">{{a.phase}}</span>
            </span>
            <span style="{{hand}} font-size: 21px; line-height: 1.1; padding-left: 22px">→ {{a.step}}</span>
            <span style="display: flex; gap: 10px; padding-left: 22px"><span style="{{small}}">{{a.meta}}</span><span style="{{a.lastStyle}}">{{a.last}}</span></span>
          </a>
        </sc-for>
      </div>
    </sc-for>
    <span style="margin-top: 14px; align-self: flex-start; font-family: 'Caveat', cursive; font-size: 21px; color: #243150">+ Neuer Anker</span>
  </main>

  <nav style="flex: none; height: 80px; border-top: 1px solid rgba(29,29,27,0.13); display: flex; align-items: center; justify-content: space-around; padding: 0 10px 14px; box-sizing: border-box">
    <a href="StartChips.dc.html" style="{{navI}}">Heute</a>
    <a href="Woche3.dc.html" style="{{navI}}">Woche</a>
    <span style="width: 52px; height: 52px; border-radius: 26px; background: #243150; color: #F5F1E8; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
    <a href="ToDos.dc.html" style="{{navI}}">To-Dos</a>
    <a href="AnkerListe.dc.html" style="{{navA}}">Anker</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {}; }
  renderVals() {
    var self = this;
    function svgUrl(w, h, inner) { var s = "<svg xmlns='http://www.w3.org/2000/svg' width='" + w + "' height='" + h + "'>" + inner + "</svg>"; return 'url("data:image/svg+xml,' + encodeURIComponent(s) + '")'; }
    function noise(id, f, o, seed, m, w, h) { return svgUrl(w, h, "<filter id='" + id + "' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='" + f + "' numOctaves='" + o + "' seed='" + seed + "' stitchTiles='stitch'/><feColorMatrix type='matrix' values='" + m + "'/></filter><rect width='100%' height='100%' filter='url(#" + id + ")'/>"); }
    var grain = noise('g', '0.9', 3, 3, '0 0 0 0 0.30  0 0 0 0 0.24  0 0 0 0 0.16  0 0 0 0.42 -0.20', 240, 240);
    var mottle = noise('m', '0.007', 2, 21, '0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.22  0 0 0 0.10 -0.04', 700, 900);
    var hole = 'rgba(60,48,30,0.30)', hi = 'rgba(255,255,255,0.7)';
    var hand = "font-family:'Caveat',cursive;color:#243150;filter:url(#kInk);text-shadow:0 0 0.6px rgba(36,49,80,0.5);";
    var V = {
      hand: hand,
      caps: 'font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#5F5B52;font-weight:600;',
      small: 'font-size:12px;color:#5F5B52;',
      tear: 'height:6px;flex:none;background-image:radial-gradient(circle at 3px 3px,' + hole + ' 1.5px,' + hi + ' 2px,transparent 2.4px);background-size:8px 6px;background-repeat:repeat-x;',
      pageStyle: "position:relative;width:390px;height:844px;box-sizing:border-box;background-color:#F5F1E8;background-image:" + grain + ",radial-gradient(circle at 1px 1px,rgba(29,29,27,0.15) 1px,transparent 1.4px)," + mottle + ";background-size:240px 240px,19px 19px,700px 900px;background-position:0 0,6px 8px,0 0;color:#243150;font-family:'Newsreader',Georgia,serif;font-weight:500;display:flex;flex-direction:column;overflow:hidden;",
      perfStyle: 'position:absolute;left:19px;top:0;bottom:80px;width:6px;background-image:radial-gradient(circle at 3px 3px,' + hole + ' 1.6px,' + hi + ' 2.1px,transparent 2.6px);background-size:6px 9px;background-repeat:repeat-y;',
      navA: "font-size:12px;letter-spacing:0.12em;text-transform:uppercase;padding:12px 4px;font-weight:600;color:#243150;border-bottom:2px solid #B08A45;",
      navI: "font-size:12px;letter-spacing:0.12em;text-transform:uppercase;padding:12px 4px;color:#5F5B52;",
      chip: 'display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#3F3C36;border:1px solid rgba(29,29,27,0.15);border-radius:999px;padding:5px 11px;background:rgba(255,255,255,0.45);'
    };

    var PH = ['Idee', 'Klären', 'Testen', 'Entscheiden', 'Läuft'];
    function mk(t, ph, step, meta, last, still, pinned) {
      return { title: t, phase: PH[ph], step: step, meta: meta, last: 'bewegt ' + last, pinned: pinned,
        lastStyle: 'font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:' + (still ? '#9A6A2A' : '#8A857A') + ';',
        phases: PH.map(function (x, i) { return 'width:22px;height:5px;border-radius:3px;' + (i <= ph ? 'background:#B08A45;opacity:' + (i === ph ? '1' : '0.55') + ';' : 'background:rgba(29,29,27,0.12);'); }) };
    }
    V.groups = [
      { name: 'In Bewegung', count: '2', items: [
        mk('Externes Büro', 2, 'Selbst einen Vormittag im Coworking arbeiten', 'Max · bis Fr', 'gestern', false, true),
        mk('Geldanlage', 3, 'Depot-Aufteilung zusammen festlegen', 'beide · Sonntag', 'vor 6 Tagen', false, false) ] },
      { name: 'Ruht', count: '3', items: [
        mk('Zweites Standbein', 1, 'Einen Abend nur dafür blocken', 'Max · diese Woche', 'vor 3 Wochen', true, true),
        mk('Wohnen', 1, 'Jeder schreibt 3 Must-haves auf', 'beide · Sonntag', 'vor 4 Wochen', true, false),
        mk('Absicherung', 0, 'Alle Verträge in eine Liste', 'Anna · Ende Nov', 'vor 5 Wochen', true, false) ] },
      { name: 'Läuft', count: '0', items: [] }
    ];

    return V;
  }
}
</script>
</body>
</html>
